<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Distribuição - Cortesia</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .animate-fadeIn { animation: fadeIn 0.2s ease-out; }
        .animate-scaleIn { animation: scaleIn 0.3s ease-out; }
        .animate-slideUp { animation: slideUp 0.3s ease-out; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .dropzone {
            border: 2px dashed #cbd5e1;
            transition: all 0.2s;
        }
        .dropzone.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .dropzone.has-file {
            border-color: #10b981;
            background-color: #ecfdf5;
        }
        .checkbox-cell input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .selected-row {
            background-color: #eef2ff !important;
        }

        /* ===== DARK MODE STYLES ===== */
        html, html *, html *::before, html *::after {
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }
        html.dark { background-color: #0f172a; }
        html.dark body { background-color: #0f172a; }
        html.dark .bg-white { background-color: #1e293b !important; }
        html.dark .bg-slate-50, html.dark .bg-slate-50\/80 { background-color: #0f172a !important; }
        html.dark .bg-slate-100 { background-color: #1e293b !important; }
        html.dark .bg-slate-800 { background-color: #334155 !important; }
        html.dark .border-slate-200, html.dark .border-slate-300 { border-color: #334155 !important; }
        html.dark .border-slate-700 { border-color: #475569 !important; }
        html.dark .divide-slate-200 > *, html.dark .divide-slate-100 > * { border-color: #334155 !important; }
        html.dark .text-slate-500, html.dark .text-slate-400 { color: #94a3b8 !important; }
        html.dark .text-slate-600 { color: #cbd5e1 !important; }
        html.dark .text-slate-700 { color: #e2e8f0 !important; }
        html.dark .text-slate-800, html.dark .text-slate-900 { color: #f1f5f9 !important; }
        html.dark .text-white { color: #f8fafc !important; }
        html.dark .placeholder-slate-400::placeholder { color: #64748b !important; }
        html.dark header { background-color: #1e293b !important; border-color: #334155 !important; }
        html.dark table thead { background-color: #1e293b !important; }
        html.dark table thead th { color: #94a3b8 !important; }
        html.dark table tbody { background-color: #1e293b !important; }
        html.dark table tbody tr { background-color: #1e293b !important; }
        html.dark table tbody tr:hover { background-color: #334155 !important; }
        html.dark input, html.dark select, html.dark textarea {
            background-color: #1e293b !important;
            border-color: #475569 !important;
            color: #e2e8f0 !important;
        }
        html.dark input:focus, html.dark select:focus, html.dark textarea:focus {
            border-color: #8b5cf6 !important;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2) !important;
        }
        html.dark input:disabled, html.dark textarea:disabled, html.dark input[readonly], html.dark textarea[readonly] {
            background-color: #0f172a !important;
            color: #64748b !important;
        }
        html.dark .shadow-sm, html.dark .shadow-md, html.dark .shadow-lg, html.dark .shadow-xl, html.dark .shadow-2xl {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3) !important;
        }
        html.dark .bg-emerald-50 { background-color: rgba(5, 150, 105, 0.15) !important; }
        html.dark .text-emerald-700 { color: #34d399 !important; }
        html.dark .border-emerald-200 { border-color: rgba(5, 150, 105, 0.3) !important; }
        html.dark .bg-red-50 { background-color: rgba(220, 38, 38, 0.15) !important; }
        html.dark .text-red-700 { color: #f87171 !important; }
        html.dark .border-red-200 { border-color: rgba(220, 38, 38, 0.3) !important; }
        html.dark .bg-amber-50 { background-color: rgba(217, 119, 6, 0.15) !important; }
        html.dark .text-amber-700 { color: #fbbf24 !important; }
        html.dark .border-amber-200 { border-color: rgba(217, 119, 6, 0.3) !important; }
        html.dark .bg-violet-50 { background-color: rgba(139, 92, 246, 0.15) !important; }
        html.dark .text-violet-700 { color: #a78bfa !important; }
        html.dark .border-violet-200 { border-color: rgba(139, 92, 246, 0.3) !important; }
        html.dark .bg-indigo-100 { background-color: rgba(99, 102, 241, 0.15) !important; }
        html.dark .bg-blue-50 { background-color: rgba(59, 130, 246, 0.15) !important; }
        html.dark .bg-orange-50 { background-color: rgba(249, 115, 22, 0.15) !important; }
        html.dark .modal-content { background-color: #1e293b !important; }
        html.dark .skeleton, html.dark .animate-pulse div { background-color: #334155 !important; }
        html.dark .bg-gradient-to-r { opacity: 0.9; }
        html.dark .bg-emerald-50\/30 { background-color: rgba(5, 150, 105, 0.08) !important; }
    </style>
    <script>
    (function() {
        const saved = localStorage.getItem('darkMode');
        if (saved === 'true') {
            document.documentElement.classList.add('dark');
        }
    })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script>
        const { useState, useEffect, useCallback, useRef } = React;

        // ============== ICONES ==============
        const UploadIcon = () => React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", width: "24", height: "24", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
            React.createElement('path', { d: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" }),

        const CheckIcon = () => React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2.5", strokeLinecap: "round", strokeLinejoin: "round" },

        const AlertIcon = () => React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", width: "20", height: "20", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
            React.createElement('path', { d: "m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" }),

        );
        const LogoutIcon = () => React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", width: "18", height: "18", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },

        );
        const RefreshIcon = () => React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", width: "18", height: "18", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
            React.createElement('polyline', { points: "23 4 23 10 17 10" }),
            React.createElement('path', { d: "M20.49 15a9 9 0 1 1-2.12-9.36L23 10" })
        );
        const SendIcon = () => React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", width: "18", height: "18", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
            React.createElement('line', { x1: "22", y1: "2", x2: "11", y2: "13" }),
            React.createElement('polygon', { points: "22 2 15 22 11 13 2 9 22 2" })
        );
        const FileIcon = () => React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", width: "20", height: "20", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
            React.createElement('path', { d: "M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" }),
            React.createElement('polyline', { points: "14 2 14 8 20 8" })
        );
        const RedistributeIcon = () => React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", width: "18", height: "18", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
            React.createElement('polyline', { points: "1 4 1 10 7 10" }),
            React.createElement('polyline', { points: "23 20 23 14 17 14" }),
            React.createElement('path', { d: "M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" })
        );

        // Dark mode icons
        const SunIcon = () => React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", width: "20", height: "20", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
            React.createElement('circle', { cx: "12", cy: "12", r: "5" }),
            React.createElement('line', { x1: "12", y1: "1", x2: "12", y2: "3" }),
            React.createElement('line', { x1: "12", y1: "21", x2: "12", y2: "23" }),
            React.createElement('line', { x1: "4.22", y1: "4.22", x2: "5.64", y2: "5.64" }),
            React.createElement('line', { x1: "18.36", y1: "18.36", x2: "19.78", y2: "19.78" }),
            React.createElement('line', { x1: "1", y1: "12", x2: "3", y2: "12" }),
            React.createElement('line', { x1: "21", y1: "12", x2: "23", y2: "12" }),
            React.createElement('line', { x1: "4.22", y1: "19.78", x2: "5.64", y2: "18.36" }),
            React.createElement('line', { x1: "18.36", y1: "5.64", x2: "19.78", y2: "4.22" })
        );
        const MoonIcon = () => React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", width: "20", height: "20", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
            React.createElement('path', { d: "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" })
        );

        // ============== COMPONENTE PRINCIPAL ==============
        function App() {
            const [token, setToken] = useState(localStorage.getItem('token'));
            const [username, setUsername] = useState(localStorage.getItem('username') || '');
            const [tarefas, setTarefas] = useState([]);
            const [usuarios, setUsuarios] = useState([]);
            const [loading, setLoading] = useState(false);
            const [uploading, setUploading] = useState(false);
            const [atualizando, setAtualizando] = useState(false);
            const [distribuindo, setDistribuindo] = useState(false);
            const [redistribuindo, setRedistribuindo] = useState(false);
            const [dragActive, setDragActive] = useState(false);
            const [fileInfo, setFileInfo] = useState(null);
            const [toast, setToast] = useState(null);
            const [stats, setStats] = useState({ total: 0, em_tratamento: 0, aprovado: 0, reprovado: 0, pendente: 0, cancelado: 0, desconsiderar: 0 });
            const [statusCounts, setStatusCounts] = useState({});
            const [selectedIds, setSelectedIds] = useState(new Set());
            const [massAssignUsuario, setMassAssignUsuario] = useState('');
            const [redistribuirMode, setRedistribuirMode] = useState(false);
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                return saved === 'true';
            });
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('darkMode', darkMode);
            }, [darkMode]);

            const toggleDarkMode = () => setDarkMode(prev => !prev);

            const getBasePath = () => window.location.pathname.startsWith('/pme_notas') ? '/pme_notas' : '';

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            useEffect(() => {
                const t = localStorage.getItem('token');
                if (!t) {
                    window.location.href = getBasePath() + '/login.html';
                    return;
                }
                setToken(t);
                const storedUser = localStorage.getItem('username');
                if (storedUser) setUsername(storedUser);
            }, []);

            const fetchTarefas = useCallback(async () => {
                if (!token) return;
                try {
                    setLoading(true);
                    const res = await fetch(`${getBasePath()}/api/cortesia/tarefas`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.status === 401 || res.status === 403) {
                        localStorage.removeItem('token');
                        window.location.href = getBasePath() + '/login.html';
                        return;
                    }
                    const data = await res.json();
                    setTarefas(data.data || []);
                    setStats({
                      total: data.total || 0,
                      em_tratamento: data.stats?.em_tratamento || 0,
                      aprovado: data.stats?.aprovado || 0,
                      reprovado: data.stats?.reprovado || 0,
                      pendente: data.stats?.pendente || 0,
                      cancelado: data.stats?.cancelado || 0,
                      desconsiderar: data.stats?.desconsiderar || 0
                    });
                    setStatusCounts(data.statusCounts || {});
                } catch (err) {
                    console.error('Erro ao buscar tarefas:', err);
                    showToast('Erro ao carregar tarefas', 'error');
                } finally {
                    setLoading(false);
                }
            }, [token]);

            const fetchUsuarios = useCallback(async () => {
                if (!token) return;
                try {
                    const res = await fetch(`${getBasePath()}/api/cortesia/usuarios`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    setUsuarios(data);
                } catch (err) {
                    console.error('Erro ao buscar usuários:', err);
                }
            }, [token]);

            useEffect(() => {
                if (token) {
                    fetchTarefas();
                    fetchUsuarios();
                }
            }, [token, fetchTarefas, fetchUsuarios]);

            const ehApr5 = (t) => String((t && t.etapa_atual) || '').toLowerCase().includes('apr5');

            const toggleSelect = (codTarefa) => {
                const tarefa = tarefas.find(t => t.cod_tarefa === codTarefa);
                if (tarefa && !ehApr5(tarefa)) {
                    showToast('Somente chamados com status AP5 podem ser selecionados', 'error');
                    return;
                }
                setSelectedIds(prev => {
                    const next = new Set(prev);
                    if (next.has(codTarefa)) next.delete(codTarefa);
                    else next.add(codTarefa);
                    return next;
                });
            };

            const toggleSelectAll = () => {
                const visiveisApr5 = filteredTarefas.filter(ehApr5);
                const visiveisSelecionadas = Array.from(selectedIds).filter(id => filteredTarefas.some(t => t.cod_tarefa === id));
                if (visiveisSelecionadas.length === visiveisApr5.length && visiveisApr5.length > 0) setSelectedIds(new Set());
                else setSelectedIds(new Set(visiveisApr5.map(t => t.cod_tarefa)));
            };

            // Normaliza texto (remove acentos, caixa baixa e espaços duplicados) para
            // permitir comparação robusta de nomes/logins digitados.
            const normalizarTexto = (s) => {
                return String(s || '')
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .toLowerCase()
                    .replace(/\s+/g, ' ')
                    .trim();
            };

            // Resuelve el id numérico del usuario de forma EXACTA (para não "roubar" a
            // digitação do campo): id puro, padrão do datalist ("id - nome (login)") ou
            // nome/login exatos (insensível a acentos e maiúsculas). Retorna '' se não houver
            // coincidência exata.
            const resolverUsuarioId = (texto) => {
                if (texto === undefined || texto === null) return '';
                const t = String(texto).trim();
                if (!t) return '';
                // 1) ID numérico puro
                if (/^\d+$/.test(t)) return t;
                // 2) Padrão do datalist: "id - nome (login)" ou "id - ..."
                const m = t.match(/^(\d+)\s*[-–—]/);
                if (m) return m[1];
                // 3) Nome/login exatos (insensível a acentos/caixa)
                const nt = normalizarTexto(t);
                if (!nt) return '';
                const u = usuarios.find(u =>
                    normalizarTexto(u.nome) === nt ||
                    normalizarTexto(u.login) === nt
                );
                return u ? String(u.id) : '';
            };

            // Variante usada NO MOMENTO da distribuição: além da resolução exata, aceita
            // correspondência PARCIAL por nome/login (ex.: digitar só o primeiro nome, com
            // ou sem acento) para garantir que o colaborador digitado seja encontrado.
            const resolverUsuarioIdDistribuicao = (texto) => {
                const exato = resolverUsuarioId(texto);
                if (exato) return exato;
                const nt = normalizarTexto(texto);
                if (!nt || nt.length < 3) return '';
                const u = usuarios.find(u => {
                    const nomeNorm = normalizarTexto(u.nome);
                    const loginNorm = normalizarTexto(u.login);
                    return nomeNorm.includes(nt) || loginNorm.includes(nt);
                });
                return u ? String(u.id) : '';
            };

            const handleMassAssign = (usuarioId) => {
                // Guardamos el texto bruto para no bloquear la digitación del
                // nombre; el id se resuelve al momento de distribuir.
                setMassAssignUsuario(usuarioId || '');
                const selecionaveis = tarefas.filter(t => selectedIds.has(t.cod_tarefa) && ehApr5(t));
                if (selecionaveis.length === 0) {
                    showToast('Selecione ao menos uma tarefa com status AP5 primeiro', 'error');
                    return;
                }
                setTarefas(prev => prev.map(t =>
                    selecionaveis.some(s => s.cod_tarefa === t.cod_tarefa) ? { ...t, usuarioSelecionado: usuarioId || '' } : t
                ));
                const resolto = resolverUsuarioIdDistribuicao(usuarioId);
                if (!resolto) {
                    showToast('Atribuído. Confirme que el usuario resuelve correctamente antes de distribuir.', 'error');
                } else {
                    showToast(`Usuário atribuído a ${selecionaveis.length} tarefa(s)`, 'success');
                }
            };

            const handleDistribuir = async () => {
                // Separa em: tarefas que podem ser distribuídas agora e tarefas que já estão
                // distribuídas (não estão mais na Fila) mas receberam um usuário.
                const elegiveis = [];
                const jaDistribuidas = [];
                for (const t of tarefas) {
                    if (!ehApr5(t) || !t.usuarioSelecionado) continue;
                    const estaDistribuida = t.usuario_distribuido_nome && String(t.usuario_distribuido_nome).trim() !== '' && String(t.usuario_distribuido_nome).trim() !== '-';
                    if (redistribuirMode || !estaDistribuida) elegiveis.push(t);
                    else jaDistribuidas.push(t);
                }

                const comUid = elegiveis.map(t => ({ ...t, _uid: resolverUsuarioIdDistribuicao(t.usuarioSelecionado) }));
                const selecionadas = comUid.filter(t => {
                    const n = Number(t._uid);
                    return Number.isInteger(n) && n > 0;
                });
                const invalidas = comUid.filter(t => {
                    const n = Number(t._uid);
                    return !(Number.isInteger(n) && n > 0);
                });

                const avisos = [];
                if (invalidas.length > 0) {
                    const amostraI = invalidas.slice(0, 3).map(t => t.cod_tarefa).join(', ');
                    avisos.push(`${invalidas.length} sem usuário válido (confira nome/id digitado): ${amostraI}${invalidas.length > 3 ? '...' : ''}`);
                }
                if (jaDistribuidas.length > 0 && !redistribuirMode) {
                    const amostraJ = jaDistribuidas.slice(0, 3).map(t => t.cod_tarefa).join(', ');
                    avisos.push(`${jaDistribuidas.length} já distribuída(s) — use o modo Redistribuir: ${amostraJ}${jaDistribuidas.length > 3 ? '...' : ''}`);
                }

                if (selecionadas.length === 0) {
                    if (avisos.length > 0) {
                        showToast(avisos.join(' | '), 'error');
                    } else {
                        showToast(redistribuirMode ? 'Selecione tarefas e atribua um usuário para redistribuir' : 'Selecione usuários para as tarefas em "Fila"', 'error');
                    }
                    return;
                }

                if (avisos.length > 0) {
                    showToast('Atenção: ' + avisos.join(' | '), 'error');
                }

                const countPorUsuario = {};
                selecionadas.forEach(t => {
                    const uid = String(t._uid);
                    countPorUsuario[uid] = (countPorUsuario[uid] || 0) + 1;
                });
                const usuarioNome = (id) => {
                    const u = usuarios.find(u => String(u.id) === String(id));
                    return u ? u.nome : id;
                };
                const alertas = Object.entries(countPorUsuario)
                    .filter(([uid, count]) => count > 10)
                    .map(([uid, count]) => `${count} para ${usuarioNome(uid)}`);
                if (alertas.length > 0) {
                    if (!window.confirm(`Muitas tarefas atribuídas para o mesmo usuário:\n${alertas.join('\n')}\n\nContinuar assim mesmo?`)) return;
                }

                                        React.createElement('th', { className: 'px-1.5 py-2' },
                                            React.createElement('input', { value: filters.etapa_atual, onChange: (e) => updateFilter('etapa_atual', e.target.value), placeholder: 'filtrar...', className: 'w-full px-1 py-1 text-xs border border-slate-200 rounded' })
                                        ),
                                        React.createElement('th', { className: 'px-1.5 py-2' },
                                            React.createElement('input', { value: filters.status, onChange: (e) => updateFilter('status', e.target.value), placeholder: 'filtrar...', className: 'w-full px-1 py-1 text-xs border border-slate-200 rounded' })
                                        ),
                                        React.createElement('th', { className: 'px-1.5 py-2' },
                                            React.createElement('input', { value: filters.approver_groups, onChange: (e) => updateFilter('approver_groups', e.target.value), placeholder: 'filtrar...', className: 'w-full px-1 py-1 text-xs border border-slate-200 rounded' })
                                        ),
                                        React.createElement('th', { className: 'px-1.5 py-2' },
                                            React.createElement('input', { value: filters.atualizada_em, onChange: (e) => updateFilter('atualizada_em', e.target.value), placeholder: 'filtrar...', className: 'w-full px-1 py-1 text-xs border border-slate-200 rounded' })
                                        ),
                                        React.createElement('th', { className: 'px-1.5 py-2' },
                                            React.createElement('input', { value: filters.usuario, onChange: (e) => updateFilter('usuario', e.target.value), placeholder: 'filtrar...', className: 'w-full px-1 py-1 text-xs border border-slate-200 rounded' })
                                        )
                                    ),
                                ),
                                React.createElement('tbody', { className: 'bg-white divide-y divide-slate-100' },
                                    filteredTarefas.slice().sort((a,b) => {
                                        const ta = a.criada_em && a.criada_em !== '-' ? new Date(a.criada_em).getTime() : null;
                                        const tb = b.criada_em && b.criada_em !== '-' ? new Date(b.criada_em).getTime() : null;
                                        if (ta === null && tb === null) return 0;
                                        if (ta === null) return 1;
                                        if (tb === null) return -1;
                                        return ta - tb;
                                    }).map(tarefa => {
                                        const isSelected = selectedIds.has(tarefa.cod_tarefa);
                                        const isApr5 = ehApr5(tarefa);
                                        const jaDistribuido = tarefa.usuario_distribuido_nome && String(tarefa.usuario_distribuido_nome).trim() !== '' && String(tarefa.usuario_distribuido_nome).trim() !== '-';
                                        const showUserField = isApr5 && (redistribuirMode || !jaDistribuido);
                                        const statusCotacaoRow = tarefa.cotacao_status && String(tarefa.cotacao_status).trim() !== '' ? String(tarefa.cotacao_status) : null;
                                        const esFila = tarefa.status_distribuicao === 'Fila';
                                        return React.createElement('tr', {
                                            key: tarefa.cod_tarefa,
                                            className: `hover:bg-slate-50/80 transition-colors duration-150 ${
                                                !isApr5 ? 'opacity-60' : ''
                                            } ${
                                                statusCotacaoRow && !redistribuirMode ? 'bg-emerald-50/30' : ''
                                            } ${isSelected ? 'selected-row' : ''}`
                                        },
                                            React.createElement('td', { className: 'px-1 py-3 whitespace-nowrap text-center checkbox-cell w-8' },
                                                React.createElement('input', { type: 'checkbox', checked: isSelected, disabled: !isApr5, onChange: () => toggleSelect(tarefa.cod_tarefa), className: 'rounded border-slate-300' })
                                            ),
                                            React.createElement('td', { className: 'px-1.5 py-3 whitespace-nowrap overflow-hidden text-ellipsis' },
                                                React.createElement('span', { className: 'text-sm font-semibold text-slate-900 font-mono bg-slate-100 px-1.5 py-0.5 rounded-md inline-block max-w-full overflow-hidden text-ellipsis', title: tarefa.assumido_por || '-' },
                                                    displayCodTarefa(tarefa)
                                                )
                                            ),
                                            React.createElement('td', { className: 'px-1.5 py-3 whitespace-nowrap' },
                                                React.createElement('span', { className: 'text-xs text-slate-700' }, tarefa.etapa_atual || '-')
                                            ),
                                            React.createElement('td', { className: 'px-1.5 py-3 whitespace-nowrap' },
                                                statusCotacaoRow ? React.createElement('span', { className: 'inline-flex items-center gap-1.5 px-2 py-0.5 text-xs font-semibold rounded-full border ' + (getStatusStyle(statusCotacaoRow).cls) },
                                                    React.createElement('span', { className: 'w-1.5 h-1.5 rounded-full ' + (getStatusStyle(statusCotacaoRow).dot) }),
                                                    getStatusStyle(statusCotacaoRow).label
                                                ) : (esFila ? React.createElement('span', { className: 'inline-flex items-center gap-1.5 px-2 py-0.5 text-xs font-semibold rounded-full border bg-amber-50 text-amber-700 border-amber-200' }, React.createElement('span', { className: 'w-1.5 h-1.5 rounded-full bg-amber-500' }), 'Fila') : React.createElement('span', { className: 'text-xs text-slate-400' }, '-'))
                                            ),
                                            React.createElement('td', { className: 'px-1.5 py-3 whitespace-nowrap' },
                                                React.createElement('span', { className: 'text-xs text-slate-700' }, tarefa.approver_groups || '-')
                                            ),
                                            React.createElement('td', { className: 'px-1.5 py-3 whitespace-nowrap' },
                                                React.createElement('span', { className: 'text-xs text-slate-500' }, formatDate(tarefa.atualizada_em))
                                            ),
                                            React.createElement('td', { className: 'px-1.5 py-3 whitespace-nowrap' },
                                                showUserField ? React.createElement('div', null,
                                                    React.createElement('input', {
                                                        list: `usuarios-list-${tarefa.cod_tarefa}`,
                                                        value: getUserDisplay(tarefa.usuarioSelecionado),
                                                        onChange: (e) => updateUsuarioSelecionado(tarefa.cod_tarefa, e.target.value),
                                                        placeholder: 'Selecione...',
                                                        className: 'w-24 px-2 py-1.5 text-sm bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-all duration-200'
                                                    }),
                                                    React.createElement('datalist', { id: `usuarios-list-${tarefa.cod_tarefa}` },
                                                        usuarios.map(u => React.createElement('option', { key: u.id, value: `${u.id} - ${u.nome} (${u.login})` }))
                                                    )
                                                ) : React.createElement('span', {
                                                        className: 'text-sm text-slate-500',
                                                        title: tarefa.usuario_distribuido_nome && tarefa.usuario_distribuido_nome !== '-' ? tarefa.usuario_distribuido_nome : undefined
                                                    }, tarefa.usuario_distribuido_nome || '-')
                                            ),
                                        );
                                    })
                                )
                            )
                        )
                    ),
                    toast && React.createElement(Toast, { toast: toast })
                )
            );
        } // Fim da função App

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(App));
    </script>
    <script src="/pme_notas/menu_navegacao.js"></script>
</body>
</html>
