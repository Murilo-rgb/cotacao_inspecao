                            React.createElement('select', { value: filtroOrigem, onChange: (e) => setFiltroOrigem(e.target.value), className: "w-44 px-3.5 py-3 bg-white border-2 border-slate-200 rounded-xl text-sm text-slate-700 focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500 focus:shadow-lg shadow-sm transition-all duration-200 group-hover:border-slate-300" },
                                React.createElement('option', { value: '' }, 'Todas as origens'),
                                React.createElement('option', { value: 'r_000250' }, '🔍 Inspeção'),
                                React.createElement('option', { value: 'iw_cpc_975_net' }, '📄 Input'),
                                React.createElement('option', { value: 'iw_cpc_975_top' }, '⬆️ TOP')
                            )
                        ),
                        React.createElement('div', { className: "relative group" },
                            React.createElement('label', { className: "block text-sm font-medium text-slate-600 mb-1.5" }, 'Status'),
                            React.createElement('select', { value: filtroStatus, onChange: (e) => setFiltroStatus(e.target.value), className: "w-44 px-3.5 py-3 bg-white border-2 border-slate-200 rounded-xl text-sm text-slate-700 focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500 focus:shadow-lg shadow-sm transition-all duration-200 group-hover:border-slate-300" },
                                React.createElement('option', { value: '' }, 'Todos os status'),
                                React.createElement('option', { value: 'base' }, 'Base do mes (reprovadas + auditadas)'),
                                React.createElement('option', { value: 'reprovado' }, 'Reprovado (somente)'),
                                React.createElement('option', { value: 'aprovado' }, 'Aprovado (somente)'),
                                React.createElement('option', { value: 'pendente' }, 'Pendente (somente)')
                            )
                        )
                    ),
                    avisoMesParcial ? React.createElement('div', { className: "mb-4 px-4 py-3 bg-amber-50 border border-amber-200 rounded-xl text-sm text-amber-800" }, avisoMesParcial) : null,
React.createElement('div', { className: "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-4" },
                        React.createElement('div', { className: "bg-white rounded-xl p-4 border border-slate-200 shadow-sm" },
                            React.createElement(CardLabel, { text: 'Total de Cotações', className: "text-sm font-medium text-slate-500", tooltip: 'Cotações consideradas no mês e no recorte selecionado. Quando a mesma pessoa possui mais de uma cotação no mesmo dia, apenas uma é contada — por isso este número pode ser menor que a extração completa da página Relatórios.' }),
                            loading ? React.createElement('div', { className: "h-7 w-20 skeleton rounded mt-1" }) : React.createElement('p', { className: "text-2xl font-bold text-slate-800 mt-1" }, totalCotacoes)
                        ),
                        React.createElement('div', { className: "bg-white rounded-xl p-4 border border-slate-200 shadow-sm" },
                            React.createElement(CardLabel, { text: 'Auditadas', className: "text-sm font-medium text-emerald-600", tooltip: 'Conta 1 auditoria por pessoa por dia. Se a mesma pessoa teve mais de uma cotação auditada no mesmo dia, o excedente não entra neste card. Portanto este NÃO é o total absoluto de auditorias do período: a página Relatórios exibe o extrato completo, tarefa por tarefa.' }),
                            loading ? React.createElement('div', { className: "h-7 w-20 skeleton rounded mt-1" }) : React.createElement('p', { className: "text-2xl font-bold text-emerald-700 mt-1" }, totalAuditadas)
                        ),
                        React.createElement('div', { className: "bg-white rounded-xl p-4 border border-slate-200 shadow-sm" },
                            React.createElement(CardLabel, { text: 'Não Auditadas', className: "text-sm font-medium text-amber-600", tooltip: 'Cotações do recorte que ainda não possuem auditoria registrada. Aplica a mesma regra de uma cotação por pessoa por dia usada nos demais cards.' }),
                            loading ? React.createElement('div', { className: "h-7 w-20 skeleton rounded mt-1" }) : React.createElement('p', { className: "text-2xl font-bold text-amber-700 mt-1" }, totalNaoAuditadas)
                        )
                    ),
React.createElement('div', { className: "flex flex-wrap gap-4 mb-4" },
                        ordemTipos.map(t => {
                            const cores = TIPO_APONTAMENTO_CORES[t] || TIPO_APONTAMENTO_CORES['SEM TIPO'];
                            const qtd = porTipoApontamento[t] || 0;
                            const isDevolucao = t === 'DEVOLUÇÃO PARCIAL/INDEVIDA';
                            const pct = totalAuditorias > 0 ? (qtd / totalAuditorias) * 100 : 0;
                            const pctFmt = totalAuditorias > 0 ? `${pct.toFixed(1).replace('.', ',')}%` : '—';
                            // Card de devolucao: exibe o percentual de erro do proprio tipo
                            // (devolucoes efetivas / total do tipo), e nao o volume do tipo.
                            const valorExibido = isDevolucao ? qtdDevolucaoEfetiva : qtd;
                            const pctExibido = isDevolucao ? pctDevolucaoFmt : pctFmt;
                            const pctBarra = isDevolucao ? pctDevolucaoEfetiva : pct;
                            const tooltip = isDevolucao
                                ? `Percentual de erro do tipo: ${qtdDevolucaoEfetiva} de ${qtd} auditorias deste tipo tiveram status de devolução (Devolução Parcial/Indevida, Reprova Parcial/Indevida). As ${qtd - qtdDevolucaoEfetiva} auditorias do tipo com status "Procedimento Correto" entram apenas no denominador — o tipo de amostra foi registrado, mas a cotação foi considerada correta. Elas aparecem em outro indicador e não são somadas aqui. Base: auditorias contadas no mês com o filtro de origem aplicado (1 auditoria por pessoa por dia).`
                                : 'Percentual calculado sobre as auditorias contadas no mês com o filtro de origem aplicado (1 auditoria por pessoa por dia). Auditorias excedentes do mesmo dia não entram no cálculo.';
                            return React.createElement('div', { key: t, className: `flex-1 min-w-[180px] bg-white rounded-xl p-4 border ${cores.borda} shadow-sm` },
                                React.createElement('div', { className: "flex items-center gap-1.5" },
                                    React.createElement('p', { className: `text-sm font-medium ${cores.texto}` }, TIPO_APONTAMENTO_LABELS[t] || t),
                                    React.createElement(InfoTooltip, { text: tooltip })
                                ),
                                React.createElement('p', { className: "text-2xl font-bold text-slate-800 mt-1" },
                                    valorExibido,
                                    React.createElement('span', { className: "text-sm font-semibold text-slate-400 ml-1.5" }, pctExibido)
                                ),
                                isDevolucao ? React.createElement('p', { className: "text-xs text-slate-400 mt-0.5" }, `${qtdDevolucaoEfetiva} de ${qtd} auditorias do tipo`) : null,
                                React.createElement('div', { className: "w-full h-1.5 bg-slate-100 rounded-full mt-2 overflow-hidden" },
                                    React.createElement('div', { className: `h-full rounded-full transition-all duration-300 ${cores.barra}`, style: { width: `${pctBarra}%` } })
                                )
                            );
                        })
                    ),
                    React.createElement('p', { className: "text-xs text-slate-400 mt-1" }, monthLabel ? `Referência: ${monthLabel}` : ''),
                    React.createElement('footer', { className: "mt-8 text-xs text-slate-400" }, 'Métricas calculadas sobre as cotações criadas no mês selecionado. Os cards de auditoria contam 1 auditoria por pessoa por dia — para o total absoluto de auditorias, use a página Relatórios.')
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
